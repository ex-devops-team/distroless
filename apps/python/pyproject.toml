[project]
name = "distroless-bench-python"
version = "0.1.0"
description = "FastAPI sample for distroless runtime benchmark"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.32.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "httpx==0.28.1",
  "ruff==0.8.4",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Dependency metadata only; app entry is main.py copied into the image.
[tool.setuptools]
py-modules = []
